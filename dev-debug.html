<script>
window.ObjectReferencesModal = {
  show: function(objectNumero) {
    console.log('Modal show called for:', objectNumero);
    alert('Références pour objet ' + objectNumero + ' - Modal fonctionnel !');
  }
};

// Observer pour les changements de mode MJ avec protection contre les boucles
let lastMJState = document.body.classList.contains('mj-on');
let mjObserverTimeout = null;

const observer = new MutationObserver(function(mutations) {
  // Éviter les boucles infinies en utilisant un debounce
  if (mjObserverTimeout) {
    clearTimeout(mjObserverTimeout);
  }
  
  mjObserverTimeout = setTimeout(() => {
    const hasMJMode = document.body.classList.contains('mj-on');
    
    // Ne traiter que si l'état a vraiment changé
    if (hasMJMode !== lastMJState) {
      lastMJState = hasMJMode;
      
      // Vérifier qu'on est sur la bonne page avant de rafraîchir
      const currentPage = window.location.hash.replace('#/', '') || 'creation';
      if (currentPage === 'gestion-objets') {
        const objectCards = document.querySelectorAll('.objet-card');
        if (objectCards.length > 0) {
          // Déclencher un événement personnalisé pour les cartes
          window.dispatchEvent(new CustomEvent('mjModeChanged', { detail: { mjMode: hasMJMode } }));
        }
      }
    }
  }, 100); // Debounce de 100ms
});

observer.observe(document.body, { attributes: true });
</script>

<!-- Test direct des effets 3D pour dev-debug -->
<script>
// Test ultra-basique d'abord
alert('🔥 DEV-DEBUG: JavaScript fonctionne !');
document.write('<div style="background:red;color:white;padding:10px;position:fixed;top:0;z-index:9999;">🔥 DEV-DEBUG JAVASCRIPT ACTIF</div>');
console.log('🔥 DEV-DEBUG - Script inline chargé');

document.addEventListener('DOMContentLoaded', function() {
    console.log('🔥 DEV-DEBUG - DOM ready');

    // Test simple
    setTimeout(function() {
        const images = document.querySelectorAll('.illus img');
        console.log('🔥 DEV-DEBUG - Images trouvées:', images.length);

        if (images.length > 0) {
            console.log('🔥 DEV-DEBUG - Première image:', images[0].src || images[0].alt);

            // Ajouter l'effet directement
            document.addEventListener('mousemove', function(e) {
                images.forEach(function(img) {
                    const rect = img.getBoundingClientRect();
                    const isHover = e.clientX >= rect.left && e.clientX <= rect.right &&
                                   e.clientY >= rect.top && e.clientY <= rect.bottom;

                    if (isHover) {
                        if (!img.dataset.testLogged) {
                            console.log('🔥 DEV-DEBUG - Survol détecté sur:', img.src || img.alt);
                            img.dataset.testLogged = 'true';
                        }

                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;

                        const rotateX = (y - centerY) / 5;
                        const rotateY = (centerX - x) / 5;

                        img.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale(1.3)';
                        img.style.filter = 'brightness(1.5) contrast(1.3)';
                        img.style.boxShadow = '0 20px 40px rgba(255,0,0,0.5)';
                    } else {
                        img.style.transform = '';
                        img.style.filter = '';
                        img.style.boxShadow = '';
                        img.dataset.testLogged = '';
                    }
                });
            });

            console.log('🔥 DEV-DEBUG - Tracking configuré');
        } else {
            console.log('🔥 DEV-DEBUG - AUCUNE IMAGE TROUVÉE !');
        }
    }, 2000); // Attendre 2 secondes pour dev-debug
});
</script>
