<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test 3D Image Effects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f4f1ea;
        }

        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .illus {
            display: flex;
            justify-content: center;
            margin: 40px 0;
            perspective: 1000px;
        }

        .illus img {
            max-width: 300px;
            height: auto;
            border-radius: 12px;
            border: 3px solid #8b4513;
            transition: transform 0.1s ease-out;
            cursor: pointer;
        }

        .debug-info {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Test 3D Image Effects</h1>

        <div class="debug-info">
            <h3>Debug Info:</h3>
            <div id="mouse-info">Mouse: x=0, y=0</div>
            <div id="transform-info">Transform: none</div>
            <div id="hover-info">Hovering: false</div>
        </div>

        <div class="illus">
            <img src="https://via.placeholder.com/300x200/8b4513/ffffff?text=Test+Image" alt="Test Image" id="test-image">
        </div>

        <div class="illus">
            <img src="https://via.placeholder.com/300x200/d4af37/000000?text=Spell+Image" alt="Spell Test" class="spell-image">
        </div>

        <p><strong>Instructions:</strong> Hover over the images above and move your mouse around. You should see the images rotate in 3D based on your cursor position.</p>

        <button onclick="testTracking()">Test Tracking</button>
    </div>

    <script>
        let isDebugMode = true;

        function updateDebugInfo(mouseX, mouseY, transform, isHovering) {
            if (isDebugMode) {
                document.getElementById('mouse-info').textContent = `Mouse: x=${mouseX}, y=${mouseY}`;
                document.getElementById('transform-info').textContent = `Transform: ${transform}`;
                document.getElementById('hover-info').textContent = `Hovering: ${isHovering}`;
            }
        }

        function setupImageTracking() {
            console.log('Setting up 3D image tracking...');

            document.addEventListener('mousemove', (e) => {
                const images = document.querySelectorAll('.illus img');

                images.forEach(img => {
                    const rect = img.getBoundingClientRect();
                    const isHovering = (
                        e.clientX >= rect.left &&
                        e.clientX <= rect.right &&
                        e.clientY >= rect.top &&
                        e.clientY <= rect.bottom
                    );

                    if (isHovering) {
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;

                        const rotateX = (y - centerY) / 8;
                        const rotateY = (centerX - x) / 8;
                        const translateZ = Math.min(50, Math.abs(rotateX) * 2 + Math.abs(rotateY) * 2);

                        const maxRotate = 15;
                        const clampedRotateX = Math.max(-maxRotate, Math.min(maxRotate, rotateX));
                        const clampedRotateY = Math.max(-maxRotate, Math.min(maxRotate, rotateY));

                        const transform = `perspective(1000px) rotateX(${clampedRotateX}deg) rotateY(${clampedRotateY}deg) translateZ(${translateZ}px) scale(1.1)`;

                        img.style.transform = transform;
                        img.style.boxShadow = '0 20px 40px rgba(0,0,0,0.3), 0 0 30px rgba(212,175,55,0.4)';

                        updateDebugInfo(x, y, transform, true);
                    } else {
                        img.style.transform = '';
                        img.style.boxShadow = '';
                        updateDebugInfo(e.clientX, e.clientY, 'none', false);
                    }
                });
            });

            console.log('3D image tracking setup complete!');
        }

        function testTracking() {
            console.log('Testing image tracking...');
            const images = document.querySelectorAll('.illus img');
            console.log('Found images:', images.length);

            images.forEach((img, index) => {
                console.log(`Image ${index}:`, {
                    src: img.src,
                    rect: img.getBoundingClientRect(),
                    computed: window.getComputedStyle(img).transform
                });
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, setting up tracking...');
            setupImageTracking();
            testTracking();
        });
    </script>
</body>
</html>
