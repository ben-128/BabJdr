<script>
window.ObjectReferencesModal = {
  show: function(objectNumero) {
    console.log('Modal show called for:', objectNumero);
    alert('Références pour objet ' + objectNumero + ' - Modal fonctionnel !');
  }
};

// Observer pour les changements de mode MJ avec protection contre les boucles
let lastMJState = document.body.classList.contains('mj-on');
let mjObserverTimeout = null;

const observer = new MutationObserver(function(mutations) {
  // Éviter les boucles infinies en utilisant un debounce
  if (mjObserverTimeout) {
    clearTimeout(mjObserverTimeout);
  }
  
  mjObserverTimeout = setTimeout(() => {
    const hasMJMode = document.body.classList.contains('mj-on');
    
    // Ne traiter que si l'état a vraiment changé
    if (hasMJMode !== lastMJState) {
      lastMJState = hasMJMode;
      
      // Vérifier qu'on est sur la bonne page avant de rafraîchir
      const currentPage = window.location.hash.replace('#/', '') || 'creation';
      if (currentPage === 'gestion-objets') {
        const objectCards = document.querySelectorAll('.objet-card');
        if (objectCards.length > 0) {
          // Déclencher un événement personnalisé pour les cartes
          window.dispatchEvent(new CustomEvent('mjModeChanged', { detail: { mjMode: hasMJMode } }));
        }
      }
    }
  }, 100); // Debounce de 100ms
});

observer.observe(document.body, { attributes: true });
</script>

<!-- Initialize app -->
<script>
// Mark as modular version
window.STANDALONE_VERSION = false;

// Service Worker registration with auto-reload on update
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then((registration) => {
    console.log('✅ Service Worker registered');

    // Check for updates every 5 minutes
    setInterval(() => {
      registration.update();
    }, 5 * 60 * 1000);

    // Auto-reload when new service worker is activated
    registration.addEventListener('updatefound', () => {
      const newWorker = registration.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          // New version available - reload automatically after a short delay
          console.log('🔄 New version detected, reloading in 2 seconds...');
          setTimeout(() => {
            window.location.reload();
          }, 2000);
        }
      });
    });
  }).catch((error) => {
    console.error('❌ Service Worker registration failed:', error);
  });

  // Listen for controller change (new SW activated)
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    window.location.reload();
  });
}

// Initialize app when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
  console.log('🚀 Initializing Foresia (Dev Mode)');

  // Initialize JdrApp if it exists
  if (window.JdrApp && window.JdrApp.init) {
    window.JdrApp.init();
  } else {
    console.error('❌ JdrApp not found!', window.JdrApp);
  }
});
</script>
