<script>
window.ObjectReferencesModal = {
  show: function(objectNumero) {
    console.log('Modal show called for:', objectNumero);
    alert('Références pour objet ' + objectNumero + ' - Modal fonctionnel !');
  }
};

// Observer pour les changements de mode MJ avec protection contre les boucles
let lastMJState = document.body.classList.contains('mj-on');
let mjObserverTimeout = null;

const observer = new MutationObserver(function(mutations) {
  // Éviter les boucles infinies en utilisant un debounce
  if (mjObserverTimeout) {
    clearTimeout(mjObserverTimeout);
  }
  
  mjObserverTimeout = setTimeout(() => {
    const hasMJMode = document.body.classList.contains('mj-on');
    
    // Ne traiter que si l'état a vraiment changé
    if (hasMJMode !== lastMJState) {
      lastMJState = hasMJMode;
      
      // Vérifier qu'on est sur la bonne page avant de rafraîchir
      const currentPage = window.location.hash.replace('#/', '') || 'creation';
      if (currentPage === 'gestion-objets') {
        const objectCards = document.querySelectorAll('.objet-card');
        if (objectCards.length > 0) {
          // Déclencher un événement personnalisé pour les cartes
          window.dispatchEvent(new CustomEvent('mjModeChanged', { detail: { mjMode: hasMJMode } }));
        }
      }
    }
  }, 100); // Debounce de 100ms
});

observer.observe(document.body, { attributes: true });
</script>

<script type="text/javascript">
	// <![CDATA[  <-- For SVG support
	if ('WebSocket' in window) {
		(function() {
			function refreshCSS() {
				var sheets = [].slice.call(document.getElementsByTagName("link"));
				var head = document.getElementsByTagName("head")[0];
				for (var i = 0; i < sheets.length; ++i) {
					var elem = sheets[i];
					head.removeChild(elem);
					var rel = elem.rel;
					if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
						var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
						elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
					}
					head.appendChild(elem);
				}
			}
			var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
			var address = protocol + window.location.host + window.location.pathname + '/ws';
			var socket = new WebSocket(address);
			socket.onmessage = function(msg) {
				if (msg.data == 'reload') window.location.reload();

			};
			console.log('Live reload enabled.');
